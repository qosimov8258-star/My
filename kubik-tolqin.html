<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kubik to'lqin</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 40%, #f4f4f6 0%, #c9c9cf 100%); }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 1.2, 15);

  scene.add(new THREE.AmbientLight(0xffffff, 0.28));
  const key = new THREE.DirectionalLight(0xffffff, 1.25);
  key.position.set(4, 8, 8);
  scene.add(key);
  const rim = new THREE.PointLight(0xff7ac8, 1.2, 40);
  rim.position.set(-8, 2, 6);
  scene.add(rim);
  const rim2 = new THREE.PointLight(0x6a7bff, 1.2, 40);
  rim2.position.set(8, -2, 6);
  scene.add(rim2);

  // Rang gradienti: pushti -> binafsha -> ko'k -> to'q sariq
  const stops = [0xff4f86, 0xb43cff, 0x4f5dff, 0x8a5cff].map(c => new THREE.Color(c));
  function gradient(t) {
    const x = t * (stops.length - 1);
    const i = Math.min(Math.floor(x), stops.length - 2);
    return stops[i].clone().lerp(stops[i + 1], x - i);
  }

  const COUNT = 150, SPAN = 14;
  const geo = new THREE.BoxGeometry(0.06, 1.6, 1.1);
  const slabs = [];
  for (let i = 0; i < COUNT; i++) {
    const t = i / (COUNT - 1);
    const mat = new THREE.MeshStandardMaterial({
      color: gradient(t), roughness: 0.28, metalness: 0.2,
    });
    const m = new THREE.Mesh(geo, mat);
    m.position.x = (t - 0.5) * SPAN;
    scene.add(m);
    slabs.push(m);
  }

  // Atrofdagi mayda nuqtalar
  const dots = new THREE.Group();
  const dotGeo = new THREE.SphereGeometry(0.022, 8, 8);
  const dotMat = new THREE.MeshBasicMaterial({ color: 0x8a8a94 });
  for (let i = 0; i < 60; i++) {
    const d = new THREE.Mesh(dotGeo, dotMat);
    d.position.set((Math.random() - 0.5) * 20, (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 6);
    d.userData = { s: Math.random() * 2 + 0.5, p: Math.random() * 6.28 };
    dots.add(d);
  }
  scene.add(dots);

  let mx = 0, my = 0;
  addEventListener('pointermove', e => {
    mx = (e.clientX / innerWidth - 0.5) * 2;
    my = (e.clientY / innerHeight - 0.5) * 2;
  });

  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.position.z = innerWidth < 700 ? 22 : 15;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  const clock = new THREE.Clock();
  (function tick() {
    const t = clock.getElapsedTime();
    slabs.forEach((m, i) => {
      const u = i / (COUNT - 1);
      const env = Math.pow(Math.sin(Math.PI * u), 0.8);        // o'rtasi katta, uchlari kichik
      const ph = t * 0.6 + u * 5.2;
      m.position.y = Math.sin(ph) * 0.9 * env;
      m.position.z = Math.cos(ph * 0.8 + 0.6) * 0.8 * env;
      m.rotation.x = Math.sin(t * 0.5 + u * 4.5) * 1.0 + (u - 0.5) * 2.6;
      m.rotation.y = Math.sin(t * 0.4 + u * 3.0) * 0.35;
      m.scale.y = 0.35 + 1.9 * env * (0.85 + 0.15 * Math.sin(ph * 1.3));
      m.scale.z = 0.6 + 0.7 * env;
    });
    dots.children.forEach(d => {
      d.position.y += Math.sin(t * d.userData.s + d.userData.p) * 0.002;
    });
    camera.position.x += (mx * 1.2 - camera.position.x) * 0.04;
    camera.position.y += (1.2 - my * 0.8 - camera.position.y) * 0.04;
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
